<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>트레이닝 분석 리포트 — positiwee</title>
<style>
/* =========================================================
   OMPB — Training Analysis Report
   Single-file template. System fonts only. No CDNs.
   Aesthetic: editorial lab report. Warm paper, ink black,
   one rust accent. Display serif + sans body + mono captions.
   ========================================================= */

:root {
  --paper: #faf8f3;
  --paper-2: #f3efe6;
  --ink: #1c1a17;
  --ink-2: #2c2925;
  --muted: #6f6c66;
  --muted-2: #9a968e;
  --rule: #e2ddd1;
  --rule-2: #cfc9bb;
  --accent: #b8401a;
  --accent-ink: #7a2a10;
  --accent-soft: #f4e3d8;
  --easy-band: rgba(184, 64, 26, 0.07);
  --good: #2f6b3f;
  --warn: #a86b14;
  --bad: #a13226;

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Hoefler Text", "AppleMyungjo", "Nanum Myeongjo", "Batang", "Georgia", "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #ebe7dd;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-variant-numeric: tabular-nums;
}

.shell {
  max-width: 880px;
  margin: 24px auto;
  background: var(--paper);
  box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 30px 60px -30px rgba(28, 26, 23, 0.25);
}

.page {
  padding: 56px 64px;
}

/* ---------- Typography ---------- */
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
h1 { font-size: 44px; line-height: 1.05; margin: 0; letter-spacing: -0.02em; }
h2 { font-size: 26px; line-height: 1.15; margin: 0 0 4px; letter-spacing: -0.015em; }
h3 { font-size: 17px; line-height: 1.25; margin: 0 0 6px; font-weight: 600; }
h4 { font-size: 13px; line-height: 1.25; margin: 0 0 4px; font-weight: 600; }
p  { margin: 0 0 12px; color: var(--ink-2); }
p:last-child { margin-bottom: 0; }
.lead { font-family: var(--serif); font-size: 19px; line-height: 1.5; color: var(--ink); }
.eyebrow {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.kicker {
  display: inline-block;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
}
.num { font-variant-numeric: tabular-nums; }

/* ---------- Section scaffolding ---------- */
.section { padding: 36px 0; border-top: 1px solid var(--rule); break-inside: avoid; }
.section.no-rule { border-top: 0; }
.section-head {
  display: grid;
  grid-template-columns: 88px 1fr auto;
  gap: 20px;
  align-items: baseline;
  margin-bottom: 22px;
}
.section-head .sno {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--accent);
  padding-top: 6px;
  border-top: 1.5px solid var(--accent);
  display: block;
}
.section-head .meta {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  color: var(--muted);
  text-transform: uppercase;
}

/* ---------- Cover ---------- */
.cover { padding-top: 0; }
.brandbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding-bottom: 22px;
  border-bottom: 1.5px solid var(--ink);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand .mark {
  width: 34px; height: 34px;
  border: 1.5px solid var(--ink);
  display: grid; place-items: center;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 600;
  font-size: 17px;
}
.brand .mark span { transform: translateY(-1px); }
.brand .word {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}
.brand .word b { font-weight: 700; color: var(--ink); }
.brand .word i { font-style: normal; color: var(--muted); }
.brandbar .meta {
  text-align: right;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  line-height: 1.7;
}
.brandbar .meta b { color: var(--ink); font-weight: 600; }

.title-block { padding: 38px 0 26px; }
.title-block .athlete {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
}
.title-block .athlete b { color: var(--accent); font-weight: 700; }
.title-block h1 .it { font-style: italic; font-family: var(--serif); color: var(--accent); }
.title-block .sub {
  margin-top: 14px;
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--muted);
}
.title-block .sub b { color: var(--ink); font-weight: 600; }

/* ---------- KPI cards ---------- */
.kpis {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0;
  border-top: 1.5px solid var(--ink);
  border-bottom: 1.5px solid var(--ink);
  margin-top: 6px;
}
.kpi {
  padding: 18px 16px 16px;
  border-right: 1px solid var(--rule);
  position: relative;
}
.kpi:last-child { border-right: 0; }
.kpi .lbl {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}
.kpi .val {
  font-family: var(--serif);
  font-size: 30px;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.kpi .val .u {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  margin-left: 3px;
  letter-spacing: 0.04em;
}
.kpi .sub {
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--muted);
}

/* ---------- Two-column body ---------- */
.col-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.col-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }

/* ---------- Limiter card ---------- */
.limiter {
  border: 1.5px solid var(--accent);
  background: var(--accent-soft);
  padding: 22px 24px 22px 24px;
  position: relative;
}
.limiter .badge {
  position: absolute;
  top: -10px;
  left: 22px;
  background: var(--accent);
  color: #fff;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  padding: 4px 9px 3px;
}
.limiter h2 {
  font-family: var(--serif);
  font-size: 24px;
  color: var(--accent-ink);
  margin-bottom: 10px;
  margin-top: 6px;
}
.limiter p { color: var(--ink); font-size: 15px; line-height: 1.55; }

/* ---------- Charts ---------- */
.chart {
  background: var(--paper);
}
.chart svg { display: block; width: 100%; height: auto; }
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  margin-top: 12px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--muted);
  text-transform: uppercase;
}
.legend .sw {
  display: inline-block;
  width: 12px; height: 10px;
  margin-right: 7px;
  vertical-align: -1px;
}
.caption {
  margin-top: 10px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  color: var(--muted);
  line-height: 1.5;
}

/* ---------- Tables ---------- */
table.pb {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
table.pb th, table.pb td {
  text-align: left;
  padding: 12px 12px;
  border-bottom: 1px solid var(--rule);
}
table.pb th {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1.5px solid var(--ink);
  padding-bottom: 8px;
}
table.pb td.event {
  font-family: var(--serif);
  font-size: 18px;
  color: var(--ink);
}
table.pb td.time {
  font-family: var(--serif);
  font-size: 22px;
  color: var(--accent-ink);
  letter-spacing: -0.01em;
}
table.pb td.date { color: var(--muted); font-family: var(--mono); font-size: 12px; }
table.pb td.note { color: var(--ink-2); font-size: 13px; }

/* ---------- Findings ---------- */
.findings { display: grid; gap: 18px; }
.finding {
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--rule);
}
.finding:first-child { border-top: 0; padding-top: 0; }
.finding .n {
  font-family: var(--serif);
  font-style: italic;
  font-size: 30px;
  color: var(--accent);
  line-height: 1;
  padding-top: 2px;
}
.finding h3 { font-family: var(--sans); font-size: 14.5px; font-weight: 600; }
.finding .ev {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.02em;
  border-left: 2px solid var(--accent);
  padding: 4px 0 4px 12px;
  margin-top: 8px;
}

/* ---------- Recommendations ---------- */
.recs { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.rec {
  padding: 18px 20px;
  border: 1px solid var(--rule);
  background: var(--paper);
}
.rec .tag {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.rec .tag .num { color: var(--muted-2); font-size: 11px; }
.rec h3 { font-family: var(--serif); font-size: 18px; margin-bottom: 6px; }
.rec p { font-size: 13px; line-height: 1.5; }
.rec .how {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--rule);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.02em;
  color: var(--muted);
  text-transform: none;
}
.rec .how b { color: var(--ink-2); font-weight: 600; }

/* ---------- Donut + bars ---------- */
.donut-row { display: grid; grid-template-columns: 180px 1fr; gap: 20px; align-items: center; }
.bar-comp { display: grid; gap: 14px; }
.bar-comp .row { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: center; }
.bar-comp .lbl {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  color: var(--muted);
  text-transform: uppercase;
  white-space: nowrap;
}
.bar-comp .bar { height: 22px; background: var(--paper-2); position: relative; }
.bar-comp .bar > span {
  position: absolute; left: 0; top: 0; bottom: 0;
  display: block;
}
.bar-comp .bar .pct {
  position: absolute;
  right: 8px; top: 50%;
  transform: translateY(-50%);
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink);
  white-space: nowrap;
}
.dot { width: 8px; height: 8px; display: inline-block; vertical-align: 1px; margin-right: 6px; }

/* ---------- Aside / pull ---------- */
.pull {
  border-left: 2px solid var(--accent);
  padding: 4px 0 4px 14px;
  font-family: var(--serif);
  font-size: 17px;
  color: var(--ink);
  margin: 10px 0;
}

/* ---------- Footer ---------- */
.footer {
  margin-top: 12px;
  padding: 26px 0 8px;
  border-top: 1.5px solid var(--ink);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: 0.04em;
  line-height: 1.6;
}
.footer b { color: var(--ink); font-weight: 600; }
.footer .right { text-align: right; }

/* ---------- Stat strip ---------- */
.strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  margin: 14px 0 18px;
}
.strip .cell {
  padding: 14px 14px;
  border-right: 1px dashed var(--rule);
}
.strip .cell:last-child { border-right: 0; }
.strip .cell .l {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.strip .cell .v {
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1;
  letter-spacing: -0.01em;
}

/* ---------- Print ---------- */
@page { size: A4; margin: 14mm 14mm; }
@media print {
  html, body { background: #fff; }
  .shell { box-shadow: none; margin: 0; max-width: none; }
  .page { padding: 0; }
  .section { break-inside: avoid; padding: 22px 0; }
  .pagebreak { break-after: page; }
  h2 { break-after: avoid; }
  .kpi { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}

/* ---------- Responsive ---------- */
@media (max-width: 760px) {
  .page { padding: 32px 24px; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .kpi { border-bottom: 1px solid var(--rule); }
  .kpi:nth-child(odd) { border-right: 1px solid var(--rule); }
  .kpi:nth-child(even) { border-right: 0; }
  .col-2 { grid-template-columns: 1fr; gap: 22px; }
  .col-3 { grid-template-columns: 1fr; }
  .recs { grid-template-columns: 1fr; }
  .donut-row { grid-template-columns: 1fr; }
  .strip { grid-template-columns: repeat(2, 1fr); }
  .section-head { grid-template-columns: 1fr; gap: 4px; }
  .section-head .sno { padding-top: 4px; }
  h1 { font-size: 34px; }
}
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="page">
    <!-- All sections rendered by JS from REPORT_DATA below -->
    <div id="report"></div>
  </div>
</div>

<script>
/* =========================================================
   REPORT_DATA — template input. Replace this object to
   regenerate the report for a different athlete.
   ========================================================= */
const REPORT_DATA = __REPORT_DATA__;

/* =========================================================
   Utilities
   ========================================================= */
const PAL = {
  ink: '#1c1a17',
  ink2: '#2c2925',
  muted: '#6f6c66',
  muted2: '#9a968e',
  rule: '#e2ddd1',
  rule2: '#cfc9bb',
  paper: '#faf8f3',
  paper2: '#f3efe6',
  accent: '#b8401a',
  accentInk: '#7a2a10',
  accentSoft: '#f4e3d8',
  cross: '#c9a37a',
  good: '#2f6b3f',
};

const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, children = []) => {
  const e = document.createElementNS(tag.startsWith('svg') || ['svg','g','rect','line','path','text','circle','polyline','polygon','tspan','defs','clipPath','linearGradient','stop'].includes(tag) ? 'http://www.w3.org/2000/svg' : 'http://www.w3.org/1999/xhtml', tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === 'class') e.setAttribute('class', v);
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const c of (Array.isArray(children) ? children : [children])) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
};

const fmt = {
  num: (n, d = 0) => n.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d }),
  date: (s) => {
    const d = new Date(s + 'T00:00:00');
    return d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
  },
  monthShort: (s) => {
    const [y, m] = s.split('-');
    return parseInt(m, 10) + '\uc6d4';
  },
  monthLong: (s) => {
    const [y, m] = s.split('-');
    return y + '\ub144 ' + parseInt(m, 10) + '\uc6d4';
  },
  paceToSec: (s) => { const [m, ss] = s.split(':').map(Number); return m * 60 + ss; },
  secToPace: (sec) => {
    const m = Math.floor(sec / 60); const s = Math.round(sec - m * 60);
    return m + ':' + String(s).padStart(2, '0');
  }
};

/* =========================================================
   Chart helpers (inline SVG, no libraries)
   ========================================================= */

// Linear scale
const scale = (d0, d1, r0, r1) => (v) => r0 + (v - d0) / (d1 - d0) * (r1 - r0);

// Generate SVG markup string. We use template literals for clarity & smaller output.
function chartMonthlyVolume(data, totals) {
  const W = 760, H = 280;
  const pad = { l: 42, r: 18, t: 14, b: 36 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;

  // distribute total cross_km evenly across months (we lack monthly breakdown)
  const crossPerMonth = totals.cross_km / data.length;

  const maxV = Math.max(...data.map(d => d.km + crossPerMonth));
  const ymax = Math.ceil(maxV / 50) * 50;
  const x = scale(0, data.length, pad.l + 8, pad.l + innerW - 8);
  const bw = (innerW - 16) / data.length * 0.74;
  const y = scale(0, ymax, pad.t + innerH, pad.t);

  // peak month (by run km)
  let peakIdx = 0; data.forEach((d,i) => { if (d.km > data[peakIdx].km) peakIdx = i; });

  // avg weekly km → avg monthly = avg_weekly * 4.345
  const avgMonthly = totals.avg_weekly_run_km * 4.345;

  const yticks = [];
  for (let v = 0; v <= ymax; v += 100) yticks.push(v);

  let bars = '';
  data.forEach((d, i) => {
    const cx = x(i + 0.5);
    const bx = cx - bw / 2;
    const yRun = y(d.km);
    const hRun = y(0) - yRun;
    const yCross = y(d.km + crossPerMonth);
    const hCross = y(d.km) - yCross;
    bars += `
      <rect x="${bx}" y="${yRun}" width="${bw}" height="${hRun}" fill="${PAL.accent}" />
      <rect x="${bx}" y="${yCross}" width="${bw}" height="${hCross}" fill="${PAL.cross}" />`;
  });

  // gridlines
  let grid = yticks.map(v => `
    <line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="${PAL.rule}" stroke-width="1"/>
    <text x="${pad.l - 8}" y="${y(v) + 3.5}" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="${PAL.muted}">${v}</text>
  `).join('');

  // x-axis labels — show year boundaries and quarters
  let xlabels = '';
  data.forEach((d, i) => {
    const [yy, mm] = d.month.split('-');
    const showMonth = (mm === '01' || mm === '07' || i === 0 || i === data.length - 1);
    if (showMonth) {
      xlabels += `<text x="${x(i+0.5)}" y="${H - pad.b + 14}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="${PAL.muted}">${fmt.monthShort(d.month)}</text>`;
      if (mm === '01' || i === 0) {
        xlabels += `<text x="${x(i+0.5)}" y="${H - pad.b + 26}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" font-weight="600" fill="${PAL.ink2}">${yy}</text>`;
      }
    }
  });

  // avg monthly line
  const avgLine = `
    <line x1="${pad.l}" x2="${W - pad.r}" y1="${y(avgMonthly)}" y2="${y(avgMonthly)}" stroke="${PAL.ink}" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="${W - pad.r - 4}" y="${y(avgMonthly) - 5}" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="${PAL.ink}">월평균 ${Math.round(avgMonthly)} km</text>`;

  // peak annotation
  const pX = x(peakIdx + 0.5);
  const pY = y(data[peakIdx].km + crossPerMonth);
  const peak = `
    <line x1="${pX}" x2="${pX}" y1="${pY - 6}" y2="${pY - 24}" stroke="${PAL.ink}" stroke-width="1"/>
    <circle cx="${pX}" cy="${pY - 6}" r="2" fill="${PAL.ink}"/>
    <text x="${pX}" y="${pY - 30}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700" fill="${PAL.ink}">피크 · ${data[peakIdx].km} km</text>
    <text x="${pX}" y="${pY - 42}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="${PAL.muted}">${fmt.monthLong(data[peakIdx].month)}</text>`;

  // y-axis title
  const ytitle = `<text transform="translate(12 ${pad.t + innerH/2}) rotate(-90)" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="${PAL.muted}" letter-spacing="1">월간 러닝 거리 · KM</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">
    ${grid}
    ${ytitle}
    ${bars}
    ${avgLine}
    ${peak}
    ${xlabels}
    <line x1="${pad.l}" x2="${W - pad.r}" y1="${y(0)}" y2="${y(0)}" stroke="${PAL.ink}" stroke-width="1.2"/>
  </svg>`;
}

function chartMonthlyLine(data, key, opts) {
  const W = 360, H = 200;
  const pad = { l: 36, r: 12, t: 16, b: 28 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;

  const vals = data.map(d => opts.transform ? opts.transform(d[key]) : d[key]);
  let vmin = Math.min(...vals), vmax = Math.max(...vals);
  // pad
  const pdv = (vmax - vmin) * 0.15;
  vmin -= pdv; vmax += pdv;
  if (opts.yticks) { vmin = opts.yticks[0]; vmax = opts.yticks[opts.yticks.length-1]; }

  const x = scale(0, data.length - 1, pad.l, pad.l + innerW);
  const y = scale(vmin, vmax, pad.t + innerH, pad.t);

  let path = '';
  vals.forEach((v, i) => { path += (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; });

  // area
  let area = path + `L ${x(vals.length-1).toFixed(1)} ${y(vmin).toFixed(1)} L ${x(0).toFixed(1)} ${y(vmin).toFixed(1)} Z`;

  // y ticks
  const yt = opts.yticks || (function(){
    const out = []; const step = (vmax - vmin) / 4;
    for (let i = 0; i <= 4; i++) out.push(vmin + i * step);
    return out;
  })();

  const grid = yt.map(v => `
    <line x1="${pad.l}" x2="${pad.l + innerW}" y1="${y(v)}" y2="${y(v)}" stroke="${PAL.rule}" stroke-width="1"/>
    <text x="${pad.l - 6}" y="${y(v) + 3.5}" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="${PAL.muted}">${opts.fmtY ? opts.fmtY(v) : v.toFixed(0)}</text>
  `).join('');

  // dots
  let dots = '';
  vals.forEach((v, i) => {
    dots += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.2" fill="${PAL.paper}" stroke="${opts.color}" stroke-width="1.4"/>`;
  });

  // x labels
  let xlabels = '';
  data.forEach((d, i) => {
    const [yy, mm] = d.month.split('-');
    if (mm === '01' || mm === '07' || i === 0 || i === data.length - 1) {
      xlabels += `<text x="${x(i)}" y="${H - pad.b + 12}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="${PAL.muted}">${fmt.monthShort(d.month)} '${yy.slice(2)}</text>`;
    }
  });

  // trend marker - last value annotation
  const lastV = vals[vals.length-1];
  const lastX = x(vals.length - 1);
  const lastY = y(lastV);

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">
    ${grid}
    <path d="${area}" fill="${opts.color}" fill-opacity="0.08"/>
    <path d="${path}" fill="none" stroke="${opts.color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <circle cx="${lastX}" cy="${lastY}" r="3.5" fill="${opts.color}"/>
    ${xlabels}
    <line x1="${pad.l}" x2="${pad.l + innerW}" y1="${y(yt[0])}" y2="${y(yt[0])}" stroke="${PAL.ink}" stroke-width="1"/>
  </svg>`;
}

function chartHRvsPace(data, easyByHalf) {
  const W = 760, H = 360;
  const pad = { l: 56, r: 24, t: 24, b: 56 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;

  const paces = data.map(d => fmt.paceToSec(d.pace));
  // x: left = slower (high pace seconds), right = faster (low pace seconds)
  const xmin = Math.max(...paces) + 20; // slowest pad
  const xmax = Math.min(...paces) - 20; // fastest pad
  const ymin = 110, ymax = 170;

  const x = (paceSec) => pad.l + (xmin - paceSec) / (xmin - xmax) * innerW;
  const y = scale(ymin, ymax, pad.t + innerH, pad.t);

  // easy band: 6:00 to 6:30
  const ebLeft = x(fmt.paceToSec('6:30'));
  const ebRight = x(fmt.paceToSec('6:00'));
  const easyBand = `<rect x="${ebLeft}" y="${pad.t}" width="${ebRight - ebLeft}" height="${innerH}" fill="${PAL.accent}" fill-opacity="0.08"/>`;
  const easyLabel = `
    <text x="${(ebLeft+ebRight)/2}" y="${pad.t + 14}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700" fill="${PAL.accent}">이지 구간 · 6:00–6:30 /km</text>`;

  // gridlines (HR)
  let grid = '';
  for (let v = 120; v <= 170; v += 10) {
    grid += `
      <line x1="${pad.l}" x2="${pad.l + innerW}" y1="${y(v)}" y2="${y(v)}" stroke="${PAL.rule}" stroke-width="1"/>
      <text x="${pad.l - 8}" y="${y(v) + 3.5}" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="${PAL.muted}">${v}</text>`;
  }

  // x-axis pace labels — every minute mark
  let xlabels = '';
  for (let m = 3; m <= 10; m++) {
    const sec = m * 60;
    if (sec >= xmax && sec <= xmin) {
      const xp = x(sec);
      xlabels += `
        <line x1="${xp}" x2="${xp}" y1="${pad.t + innerH}" y2="${pad.t + innerH + 4}" stroke="${PAL.ink}" stroke-width="1"/>
        <text x="${xp}" y="${pad.t + innerH + 16}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="${PAL.ink2}">${m}:00</text>`;
    }
  }

  // line through points (sorted by pace seconds desc → x ascending)
  const sorted = [...data].sort((a, b) => fmt.paceToSec(b.pace) - fmt.paceToSec(a.pace));
  let line = '';
  sorted.forEach((d, i) => {
    const ps = fmt.paceToSec(d.pace);
    line += (i === 0 ? 'M' : 'L') + x(ps).toFixed(1) + ' ' + y(d.avg_hr).toFixed(1) + ' ';
  });

  // bubble points, sized by n
  const maxN = Math.max(...data.map(d => d.n));
  let bubbles = '';
  data.forEach(d => {
    const ps = fmt.paceToSec(d.pace);
    const r = 3 + Math.sqrt(d.n / maxN) * 9;
    bubbles += `
      <circle cx="${x(ps)}" cy="${y(d.avg_hr)}" r="${r}" fill="${PAL.accent}" fill-opacity="0.18" stroke="${PAL.accent}" stroke-width="1.2"/>
      <text x="${x(ps)}" y="${y(d.avg_hr) - r - 4}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="${PAL.muted}">n=${d.n}</text>`;
  });

  // axis titles
  const xtitle = `<text x="${pad.l + innerW/2}" y="${H - 14}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="${PAL.muted}" letter-spacing="2">페이스 · 분/KM &nbsp;&nbsp; ◄ 느림 &nbsp;&nbsp;&nbsp;&nbsp; 빠름 ►</text>`;
  const ytitle = `<text transform="translate(16 ${pad.t + innerH/2}) rotate(-90)" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="${PAL.muted}" letter-spacing="2">평균 심박수 · BPM</text>`;

  // Plateau annotation arrow
  const ann = `
    <text x="${pad.l + innerW - 100}" y="${pad.t + 28}" font-family="${'serif'}" font-size="11" fill="${PAL.accentInk}" font-style="italic"></text>`;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">
    ${easyBand}
    ${grid}
    ${easyLabel}
    <path d="${line}" fill="none" stroke="${PAL.accent}" stroke-width="1.4" stroke-opacity="0.45"/>
    ${bubbles}
    ${xlabels}
    <line x1="${pad.l}" x2="${pad.l + innerW}" y1="${pad.t + innerH}" y2="${pad.t + innerH}" stroke="${PAL.ink}" stroke-width="1.2"/>
    <line x1="${pad.l}" x2="${pad.l}" y1="${pad.t}" y2="${pad.t + innerH}" stroke="${PAL.ink}" stroke-width="1.2"/>
    ${xtitle}
    ${ytitle}
  </svg>`;
}

function chartEasyPlateau(data) {
  const W = 360, H = 200;
  const pad = { l: 44, r: 16, t: 18, b: 34 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const ymin = 120, ymax = 142;

  const x = scale(0, data.length - 1, pad.l + 16, pad.l + innerW - 16);
  const y = scale(ymin, ymax, pad.t + innerH, pad.t);

  let grid = '';
  for (let v = 120; v <= 140; v += 5) {
    grid += `
      <line x1="${pad.l}" x2="${pad.l + innerW}" y1="${y(v)}" y2="${y(v)}" stroke="${PAL.rule}" stroke-width="1"/>
      <text x="${pad.l - 6}" y="${y(v) + 3.5}" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="${PAL.muted}">${v}</text>`;
  }

  let path = '';
  let dots = '';
  let labels = '';
  data.forEach((d, i) => {
    path += (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ' ' + y(d.hr).toFixed(1) + ' ';
    dots += `<circle cx="${x(i)}" cy="${y(d.hr)}" r="4" fill="${PAL.accent}"/>`;
    dots += `<text x="${x(i)}" y="${y(d.hr) - 9}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700" fill="${PAL.ink}">${d.hr}</text>`;
    labels += `<text x="${x(i)}" y="${H - pad.b + 14}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="${PAL.muted}">${d.label}</text>`;
  });

  // average line (showing flatness)
  const avg = data.reduce((s, d) => s + d.hr, 0) / data.length;
  const avgLine = `
    <line x1="${pad.l + 8}" x2="${pad.l + innerW - 8}" y1="${y(avg)}" y2="${y(avg)}" stroke="${PAL.ink}" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.5"/>`;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">
    ${grid}
    ${avgLine}
    <path d="${path}" fill="none" stroke="${PAL.accent}" stroke-width="1.6"/>
    ${dots}
    ${labels}
    <line x1="${pad.l}" x2="${pad.l + innerW}" y1="${y(ymin)}" y2="${y(ymin)}" stroke="${PAL.ink}" stroke-width="1"/>
  </svg>`;
}

function chartDonut(byType, byHr) {
  const W = 180, H = 180;
  const cx = W / 2, cy = H / 2, R = 76, r = 48;

  const total = byType.easy + byType.long + byType.cross;
  const slices = [
    { k: 'Easy runs', v: byType.easy, c: PAL.accent },
    { k: 'Long runs', v: byType.long, c: PAL.accentInk },
    { k: 'Cross-train', v: byType.cross, c: PAL.cross },
  ];

  let acc = -Math.PI / 2;
  let paths = '';
  slices.forEach(s => {
    const a0 = acc;
    const a1 = acc + (s.v / total) * Math.PI * 2;
    const lar = (a1 - a0) > Math.PI ? 1 : 0;
    const x0 = cx + Math.cos(a0) * R, y0 = cy + Math.sin(a0) * R;
    const x1 = cx + Math.cos(a1) * R, y1 = cy + Math.sin(a1) * R;
    const x2 = cx + Math.cos(a1) * r, y2 = cy + Math.sin(a1) * r;
    const x3 = cx + Math.cos(a0) * r, y3 = cy + Math.sin(a0) * r;
    paths += `<path d="M${x0} ${y0} A${R} ${R} 0 ${lar} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${lar} 0 ${x3} ${y3} Z" fill="${s.c}"/>`;
    acc = a1;
  });

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">
    ${paths}
    <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9.5" letter-spacing="1.2" fill="${PAL.muted}">세션 수</text>
    <text x="${cx}" y="${cy + 20}" text-anchor="middle" font-family="${'serif'}" font-size="26" fill="${PAL.ink}" font-weight="600">${total}</text>
  </svg>`;
}

function chartLongRuns(data) {
  const W = 760, H = 220;
  const pad = { l: 40, r: 24, t: 26, b: 32 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;

  const ymax = 110;
  const x = scale(0, data.length - 1, pad.l + 6, pad.l + innerW - 6);
  const y = scale(0, ymax, pad.t + innerH, pad.t);

  let path = '';
  data.forEach((d, i) => {
    path += (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ' ' + y(d.longest_km).toFixed(1) + ' ';
  });
  const area = path + ` L ${x(data.length-1).toFixed(1)} ${y(0).toFixed(1)} L ${x(0).toFixed(1)} ${y(0).toFixed(1)} Z`;

  // gridlines
  let grid = '';
  [0, 21.1, 42.2, 100].forEach((v, i) => {
    const isMarathon = v === 42.2;
    const isUltra = v === 100;
    const isHalf = v === 21.1;
    const lbl = isMarathon ? '풀코스 · 42.2' : isHalf ? '하프 · 21.1' : isUltra ? '울트라 · 100' : '';
    grid += `
      <line x1="${pad.l}" x2="${pad.l + innerW}" y1="${y(v)}" y2="${y(v)}" stroke="${i === 0 ? PAL.ink : PAL.rule}" stroke-width="${i === 0 ? 1 : 1}" stroke-dasharray="${i === 0 ? '0' : '3 3'}"/>
      <text x="${pad.l + innerW - 4}" y="${y(v) - 4}" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="${PAL.muted}">${lbl}</text>
      <text x="${pad.l - 6}" y="${y(v) + 3.5}" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="${PAL.muted}">${v.toString().includes('.') ? v.toFixed(1) : v}</text>`;
  });

  // x labels
  let xlabels = '';
  data.forEach((d, i) => {
    const [yy, mm] = d.month.split('-');
    if (mm === '01' || mm === '07' || i === 0 || i === data.length - 1) {
      xlabels += `<text x="${x(i)}" y="${H - pad.b + 14}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="${PAL.muted}">${fmt.monthShort(d.month)} '${yy.slice(2)}</text>`;
    }
  });

  // dots, highlight ultra
  let dots = '';
  data.forEach((d, i) => {
    const isUltra = d.longest_km >= 99;
    dots += `<circle cx="${x(i)}" cy="${y(d.longest_km)}" r="${isUltra ? 4.5 : 2.2}" fill="${isUltra ? PAL.accent : PAL.paper}" stroke="${PAL.accent}" stroke-width="${isUltra ? 0 : 1.2}"/>`;
    if (isUltra) {
      dots += `
        <line x1="${x(i)}" x2="${x(i)}" y1="${y(d.longest_km) - 8}" y2="${y(d.longest_km) - 22}" stroke="${PAL.ink}" stroke-width="1"/>
        <text x="${x(i)}" y="${y(d.longest_km) - 26}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700" fill="${PAL.ink}">100 KM 울트라</text>
        <text x="${x(i)}" y="${y(d.longest_km) - 38}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="${PAL.muted}">${fmt.monthLong(d.month)} · 13.2시간 · HR 133</text>`;
    }
  });

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">
    ${grid}
    <path d="${area}" fill="${PAL.accent}" fill-opacity="0.08"/>
    <path d="${path}" fill="none" stroke="${PAL.accent}" stroke-width="1.6" stroke-linejoin="round"/>
    ${dots}
    ${xlabels}
  </svg>`;
}

function chartRecentWeeks(weeks) {
  const W = 360, H = 120;
  const pad = { l: 8, r: 8, t: 16, b: 22 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const ymax = Math.max(...weeks);
  const bw = (innerW) / weeks.length * 0.7;
  const gap = (innerW) / weeks.length * 0.3;
  const avg = weeks.reduce((s, v) => s + v, 0) / weeks.length;
  const y = scale(0, ymax, pad.t + innerH, pad.t);
  let bars = '';
  weeks.forEach((v, i) => {
    const cx = pad.l + (i + 0.5) * (innerW / weeks.length);
    const bx = cx - bw / 2;
    bars += `<rect x="${bx}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" fill="${PAL.accent}" fill-opacity="${v < avg * 0.6 || v > avg * 1.5 ? 1 : 0.5}"/>`;
    bars += `<text x="${cx}" y="${y(v) - 4}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="${PAL.ink2}">${v}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">
    <line x1="${pad.l}" x2="${pad.l + innerW}" y1="${y(avg)}" y2="${y(avg)}" stroke="${PAL.ink}" stroke-dasharray="2 3" stroke-width="1"/>
    ${bars}
    <line x1="${pad.l}" x2="${pad.l + innerW}" y1="${y(0)}" y2="${y(0)}" stroke="${PAL.ink}" stroke-width="1"/>
    <text x="${pad.l}" y="${H - 6}" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="${PAL.muted}">10주 전</text>
    <text x="${pad.l + innerW}" y="${H - 6}" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="${PAL.muted}">이번 주</text>
  </svg>`;
}

/* =========================================================
   Component HTML helpers
   ========================================================= */
function kpiHTML(label, value, sub, unit) {
  return `
    <div class="kpi">
      <div class="lbl">${label}</div>
      <div class="val">${value}${unit ? ` <span class="u">${unit}</span>` : ''}</div>
      ${sub ? `<div class="sub">${sub}</div>` : ''}
    </div>`;
}

function sectionHeadHTML(no, title, meta) {
  return `
    <div class="section-head">
      <div class="sno">§ ${no}</div>
      <h2>${title}</h2>
      <div class="meta">${meta}</div>
    </div>`;
}

function barRowHTML(label, value, total, color, isPct = false) {
  const pct = isPct ? value : (value / total) * 100;
  const display = isPct ? value.toFixed(0) + '%' : `${value} · ${pct.toFixed(0)}%`;
  return `
    <div class="row">
      <div class="lbl">${label}</div>
      <div class="bar">
        <span style="width:${pct}%; background:${color}"></span>
        <span class="pct">${display}</span>
      </div>
    </div>`;
}

function findingHTML(text, i) {
  // Split observation into a headline (first clause) and evidence pull-quote.
  // Find the first colon that is NOT inside a numeric pattern (e.g. "7:36" pace).
  let head = text, ev = '';
  for (let k = 0; k < text.length; k++) {
    if (text[k] !== ':') continue;
    const prev = text[k - 1] || '';
    const next = text[k + 1] || '';
    if (/\d/.test(prev) && /\d/.test(next)) continue;
    if (k > 120) break;
    head = text.slice(0, k).trim();
    ev = text.slice(k + 1).trim();
    break;
  }
  return `
    <div class="finding">
      <div class="n">${String(i + 1).padStart(2, '0')}</div>
      <div>
        <h3>${head}</h3>
        ${ev ? `<div class="ev">${ev}</div>` : ''}
      </div>
    </div>`;
}

function prettyEvent(e) {
  return ({ '10k': '10 키로미터', 'half': '하프 마라톤', 'full': '풀 마라톤' }[e] || e);
}

function pbNote(p, D) {
  if (p.event === 'full')  return '서브-3 달성; 벤치마크 목표 도달.';
  if (p.event === 'half')  return '10k PB 이후 6일 만에 수립 — 샤프한 피킹 윈도우 내 기록.';
  if (p.event === '10k')   return '2025년 가을 레이스 블록의 첫 머리에서 수립.';
  return '';
}

function hashStr(s) {
  let h = 0; for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return h;
}
