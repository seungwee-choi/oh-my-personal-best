[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-personal-best"
version = "0.1.0"
description = "Provider-agnostic marathon-coaching toolkit: ompb_core + an MCP server and a Claude Agent SDK app, reusing the Claude Code plugin's specialists and deterministic toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "oh-my-personal-best contributors" }]
keywords = ["marathon", "running", "coaching", "mcp", "claude-agent-sdk", "training-plan"]
dependencies = []  # ompb_core is standard-library only

[project.optional-dependencies]
fit = ["fitdecode>=0.10.0"]                 # .fit (Garmin/COROS) import
mcp = ["mcp[cli]>=1.2.0"]                    # MCP server (servers/mcp_server.py)
agent = ["claude-agent-sdk>=0.1.0"]          # Agent SDK app (apps/coach)
all = ["fitdecode>=0.10.0", "mcp[cli]>=1.2.0", "claude-agent-sdk>=0.1.0"]

[project.scripts]
ompb-coach = "apps.coach.app:main"

[tool.setuptools]
# scripts/ + templates/ are bundled into ompb_core/_bundled/ at build time (setup.py),
# so wheels are self-contained: `pip install .` or editable `pip install -e .[all]`.
packages = ["ompb_core", "apps", "apps.coach"]

[tool.setuptools.package-data]
ompb_core = ["_bundled/scripts/*.py", "_bundled/scripts/insight_detectors/*.py", "_bundled/templates/*.html"]
"apps.coach" = ["_bundled/CLAUDE.md", "_bundled/agents/*.md"]
